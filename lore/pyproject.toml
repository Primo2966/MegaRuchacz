[project]
name = "lore"
version = "0.1.0"
description = "Local MCP server: searchable memory of Claude Code conversations (FTS5 + vectors)"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=2.0",
    "fastembed>=0.4",
    "huggingface-hub>=0.20",
    "numpy>=1.26",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
